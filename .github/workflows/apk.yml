name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto
        run: unzip -o PrescriptorNDVI-Android.zip

      - name: Compilar APK
        working-directory: PrescriptorNDVI-Android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PrescriptorNDVI-apk
          path: PrescriptorNDVI-Android/app/build/outputs/apk/release/*.apk
