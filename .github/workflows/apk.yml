name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Archivo encontrado: $ZIP"
          unzip -o "$ZIP"
          DIR=$(dirname "$(find . -name gradlew -not -path './.git/*' | head -n 1)")
          echo "Proyecto en: $DIR"
          echo "PROYECTO=$DIR" >> "$GITHUB_ENV"

      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK
        run: |
          cd "$PROYECTO"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PrescriptorNDVI-apk
          path: '**/app/build/outputs/apk/release/*.apk'
